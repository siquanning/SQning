<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SillyTavern Manager</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.5 system-ui,-apple-system,sans-serif; background:#1a1a2e; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#555; border-radius:3px; }

/* Top bar */
.topbar { display:flex; align-items:center; gap:16px; padding:8px 16px; background:#16213e; border-bottom:1px solid #0f3460; }
.topbar h1 { font-size:18px; color:#e94560; }
.topbar .ver { font-size:11px; color:#888; }
.topbar .spacer { flex:1; }
.topbar .btn { cursor:pointer; border:none; border-radius:4px; padding:6px 14px; font-size:13px; transition:.15s; }
.topbar .btn-launch { background:#e94560; color:#fff; }
.topbar .btn-launch:hover { background:#c23152; }
.topbar .btn-launch:disabled { background:#555; cursor:default; }
.topbar .btn-refresh { background:#0f3460; color:#ccc; }
.topbar .btn-refresh:hover { background:#1a4a7a; }

/* Main layout */
.main { display:flex; flex:1; overflow:hidden; }

/* Sidebar */
.sidebar { width:260px; background:#16213e; border-right:1px solid #0f3460; display:flex; flex-direction:column; overflow-y:auto; }
.side-section { border-bottom:1px solid #0f3460; }
.side-head { padding:10px 14px; font-size:12px; font-weight:700; text-transform:uppercase; color:#888; letter-spacing:1px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.side-head:hover { color:#ccc; }
.side-item { padding:7px 14px 7px 22px; cursor:pointer; font-size:13px; border-left:2px solid transparent; transition:.1s; }
.side-item:hover { background:#1a2744; }
.side-item.active { border-left-color:#e94560; background:#1a2744; color:#fff; }

/* Editor */
.editor { flex:1; overflow-y:auto; padding:20px 28px; }
.editor h2 { font-size:20px; margin-bottom:16px; color:#e94560; }
.editor .empty { color:#666; text-align:center; margin-top:80px; font-size:15px; }

/* Form */
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; color:#999; margin-bottom:4px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.field input, .field textarea, .field select { width:100%; padding:8px 10px; background:#0d1b2a; border:1px solid #1b3a5c; border-radius:4px; color:#e0e0e0; font:inherit; resize:vertical; }
.field textarea { min-height:80px; font-size:13px; line-height:1.6; }
.field input:focus, .field textarea:focus { outline:none; border-color:#e94560; }
.field .hint { font-size:11px; color:#666; margin-top:2px; }

.row { display:flex; gap:16px; }
.row .field { flex:1; }

/* Entries (world book / character book) */
.entry-card { background:#0d1b2a; border:1px solid #1b3a5c; border-radius:6px; padding:16px; margin-bottom:10px; }
.entry-card .entry-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.entry-card .entry-id { font-size:11px; color:#666; min-width:40px; }
.entry-card .entry-keys { flex:1; }
.entry-card .entry-keys input { background:#16213e; border:1px solid #1b3a5c; padding:4px 8px; border-radius:3px; color:#e0e0e0; width:100%; }
.entry-card .entry-content textarea { min-height:60px; background:#16213e; }
.entry-card .entry-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }

.btn-sm { cursor:pointer; border:none; border-radius:3px; padding:4px 10px; font-size:12px; transition:.15s; }
.btn-danger { background:#5c1a1a; color:#e88; }
.btn-danger:hover { background:#7c2a2a; }
.btn-primary { background:#0f3460; color:#ccc; }
.btn-primary:hover { background:#1a4a7a; }
.btn-save { background:#e94560; color:#fff; padding:8px 20px; font-size:14px; font-weight:600; }
.btn-save:hover { background:#c23152; }
.btn-save:disabled { background:#555; cursor:default; }

.entry-toolbar { display:flex; gap:10px; margin-bottom:16px; align-items:center; }

.save-area { display:flex; align-items:center; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid #0f3460; }
.save-area .status { font-size:12px; }
.save-area .status.ok { color:#4caf50; }
.save-area .status.err { color:#e94560; }

/* Launch modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#1a2744; border:1px solid #0f3460; border-radius:8px; padding:24px; min-width:320px; text-align:center; }
.modal h3 { margin-bottom:12px; color:#e94560; }
.modal .status-msg { color:#4caf50; margin:12px 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>SillyTavern Manager</h1>
  <span class="ver">v1.17.0</span>
  <span class="spacer"></span>
  <button class="btn btn-refresh" onclick="refresh()">Refresh</button>
  <button class="btn btn-launch" id="btnLaunch" onclick="launch()">Launch SillyTavern</button>
</div>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="side-section">
      <div class="side-head">Characters</div>
      <div id="charList"></div>
    </div>
    <div class="side-section">
      <div class="side-head">World Books</div>
      <div id="worldList"></div>
    </div>
  </div>

  <!-- Editor -->
  <div class="editor" id="editor">
    <div class="empty">Select a character or world book from the left</div>
  </div>
</div>

<script>
// === State ===
let currentTab = null; // { type: 'char'|'world', name: string }
let currentData = null;

// === API ===
const api = {
  async get(url) { const r = await fetch(url); return r.json(); },
  async put(url, data) { const r = await fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); return r.json(); },
  async post(url, data) { const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); return r.json(); },
  async del(url) { const r = await fetch(url, { method:'DELETE' }); return r.json(); }
};

// === Load sidebar ===
async function refresh() {
  await loadChars();
  await loadWorlds();
}

async function loadChars() {
  const chars = await api.get('/api/chars');
  document.getElementById('charList').innerHTML = (chars||[]).map(c =>
    `<div class="side-item" data-type="char" data-name="${esc(c.name)}" onclick="selectChar('${esc(c.name)}')">${esc(c.name)}</div>`
  ).join('');
}

async function loadWorlds() {
  const worlds = await api.get('/api/worlds');
  document.getElementById('worldList').innerHTML = (worlds||[]).map(w =>
    `<div class="side-item" data-type="world" data-name="${esc(w.name)}" onclick="selectWorld('${esc(w.name)}')">${esc(w.name)} <span style="color:#666;font-size:11px">(${w.count})</span></div>`).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// === Selection ===
async function selectChar(name) {
  highlight('char', name);
  currentTab = { type: 'char', name };
  const res = await api.get(`/api/chars/${encodeURIComponent(name)}`);
  if (res.error) { document.getElementById('editor').innerHTML = `<div class="empty">Error: ${esc(res.error)}</div>`; return; }
  currentData = res.card;
  renderCharEditor(res.card, res.file, res.path);
}

async function selectWorld(name) {
  highlight('world', name);
  currentTab = { type: 'world', name };
  const res = await api.get(`/api/worlds/${encodeURIComponent(name)}`);
  if (res.error) { document.getElementById('editor').innerHTML = `<div class="empty">Error: ${esc(res.error)}</div>`; return; }
  currentData = res;
  renderWorldEditor(name, res);
}

function highlight(type, name) {
  document.querySelectorAll('.side-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.side-item[data-type="${type}"][data-name="${esc(name)}"]`);
  if (el) el.classList.add('active');
}

// === Char Editor ===
function renderCharEditor(card, file, filePath) {
  const d = card.data || card;
  document.getElementById('editor').innerHTML = `
    <h2>${esc(d.name || card.name || '')}</h2>
    <div style="color:#666;font-size:11px;margin-bottom:16px">${esc(file)}</div>

    <div class="field">
      <label>Description (人物设定)</label>
      <textarea id="f_desc" rows="12">${esc(d.description || '')}</textarea>
    </div>
    <div class="field">
      <label>Personality (性格)</label>
      <textarea id="f_pers" rows="6">${esc(d.personality || '')}</textarea>
    </div>
    <div class="field">
      <label>Scenario (场景)</label>
      <textarea id="f_scenario" rows="3">${esc(d.scenario || '')}</textarea>
    </div>
    <div class="field">
      <label>First Message (开场白)</label>
      <textarea id="f_first" rows="4">${esc(d.first_mes || '')}</textarea>
    </div>
    <div class="field">
      <label>Message Example (对话示例)</label>
      <textarea id="f_mes" rows="6">${esc(d.mes_example || '')}</textarea>
    </div>
    <div class="field">
      <label>System Prompt (系统提示)</label>
      <textarea id="f_sys" rows="4">${esc(d.system_prompt || '')}</textarea>
    </div>
    <div class="field">
      <label>Post-History Instructions</label>
      <textarea id="f_post" rows="3">${esc(d.post_history_instructions || '')}</textarea>
    </div>
    <div class="row">
      <div class="field">
        <label>Talkativeness (闲聊度)</label>
        <input type="range" min="0" max="1" step="0.05" value="${d.extensions?.talkativeness || d.talkativeness || 0.5}" id="f_talk">
        <span class="hint" id="talkVal">${d.extensions?.talkativeness || d.talkativeness || 0.5}</span>
      </div>
      <div class="field">
        <label>Tags (逗号分隔)</label>
        <input type="text" value="${esc((d.tags||[]).join(', '))}" id="f_tags">
      </div>
    </div>

    <!-- Character Book -->
    <div class="field">
      <label>Character Book (内嵌世界书) — ${((d.character_book?.entries)||[]).length} entries</label>
      <div id="charBookEntries">
        ${((d.character_book?.entries)||[]).map((e,i) => `
          <div class="entry-card">
            <div class="entry-header">
              <span class="entry-id">#${e.id}</span>
              <div class="entry-keys">
                <input type="text" value="${esc((e.keys||[]).join(', '))}" placeholder="Keys" data-cb-idx="${i}" data-field="keys">
              </div>
              <input type="text" value="${esc(e.comment||'')}" placeholder="备注" style="width:120px" data-cb-idx="${i}" data-field="comment">
            </div>
            <div class="entry-content">
              <textarea rows="4" data-cb-idx="${i}" data-field="content">${esc(e.content||'')}</textarea>
            </div>
            <div class="entry-actions">
              <button class="btn-sm btn-danger" onclick="removeCharBookEntry(${i})">Remove</button>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn-sm btn-primary" onclick="addCharBookEntry()" style="margin-top:8px">+ Add Entry</button>
    </div>

    <div class="save-area">
      <button class="btn btn-save" onclick="saveChar()">Save Character</button>
      <span class="status" id="saveStatus"></span>
    </div>
  `;
  document.getElementById('f_talk').oninput = function() { document.getElementById('talkVal').textContent = this.value; };
}

function collectCharBookEntries() {
  const entries = [];
  document.querySelectorAll('#charBookEntries .entry-card').forEach((card, i) => {
    entries.push({
      id: i,
      keys: (card.querySelector('[data-field="keys"]')?.value || '').split(',').map(k => k.trim()).filter(Boolean),
      comment: card.querySelector('[data-field="comment"]')?.value || '',
      content: card.querySelector('[data-field="content"]')?.value || '',
      constant: false, selective: false
    });
  });
  return entries;
}

function addCharBookEntry() {
  const i = document.querySelectorAll('#charBookEntries .entry-card').length;
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.innerHTML = `
    <div class="entry-header">
      <span class="entry-id">#${i}</span>
      <div class="entry-keys"><input type="text" placeholder="Keys" data-cb-idx="${i}" data-field="keys"></div>
      <input type="text" placeholder="备注" style="width:120px" data-cb-idx="${i}" data-field="comment">
    </div>
    <div class="entry-content"><textarea rows="4" data-cb-idx="${i}" data-field="content"></textarea></div>
    <div class="entry-actions"><button class="btn-sm btn-danger" onclick="this.closest('.entry-card').remove()">Remove</button></div>
  `;
  document.getElementById('charBookEntries').appendChild(div);
}

function removeCharBookEntry(i) {
  document.querySelectorAll('#charBookEntries .entry-card')[i]?.remove();
}

async function saveChar() {
  const status = document.getElementById('saveStatus');
  status.textContent = 'Saving...';
  status.className = 'status';

  const d = currentData.data || currentData;
  const updated = { ...currentData };
  const data = updated.data || updated;

  if (document.getElementById('f_desc')) data.description = document.getElementById('f_desc').value;
  if (document.getElementById('f_pers')) data.personality = document.getElementById('f_pers').value;
  if (document.getElementById('f_scenario')) data.scenario = document.getElementById('f_scenario').value;
  if (document.getElementById('f_first')) data.first_mes = document.getElementById('f_first').value;
  if (document.getElementById('f_mes')) data.mes_example = document.getElementById('f_mes').value;
  if (document.getElementById('f_sys')) data.system_prompt = document.getElementById('f_sys').value;
  if (document.getElementById('f_post')) data.post_history_instructions = document.getElementById('f_post').value;
  if (document.getElementById('f_talk')) {
    const talk = document.getElementById('f_talk').value;
    if (data.extensions) data.extensions.talkativeness = talk;
    data.talkativeness = talk;
  }
  if (document.getElementById('f_tags')) {
    data.tags = document.getElementById('f_tags').value.split(',').map(t => t.trim()).filter(Boolean);
  }

  if (!data.character_book) data.character_book = { entries: [] };
  data.character_book.entries = collectCharBookEntries();

  const res = await api.put(`/api/chars/${encodeURIComponent(currentTab.name)}`, updated);
  if (res.ok) {
    status.textContent = 'Saved!';
    status.className = 'status ok';
    setTimeout(() => { status.textContent = ''; }, 2000);
  } else {
    status.textContent = 'Error: ' + (res.error || 'unknown');
    status.className = 'status err';
  }
}

// === World Editor ===
function renderWorldEditor(name, data) {
  const entries = data.entries || {};
  const ids = Object.keys(entries);
  document.getElementById('editor').innerHTML = `
    <h2>${esc(name)}</h2>
    <div style="color:#666;font-size:11px;margin-bottom:16px">${ids.length} entries</div>

    <div id="worldEntries">
      ${ids.map(id => {
        const e = entries[id];
        return `
          <div class="entry-card" data-id="${id}">
            <div class="entry-header">
              <span class="entry-id">#${id}</span>
              <div class="entry-keys">
                <input type="text" value="${esc((e.keys||[]).join(', '))}" placeholder="Keys" data-field="keys">
              </div>
              <input type="text" value="${esc(e.comment||'')}" placeholder="备注" style="width:120px" data-field="comment">
            </div>
            <div class="entry-content">
              <textarea rows="4" data-field="content">${esc(e.content||'')}</textarea>
            </div>
            <div class="entry-actions">
              <button class="btn-sm btn-danger" onclick="removeWorldEntry(${id})">Remove</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="entry-toolbar">
      <button class="btn-sm btn-primary" onclick="addWorldEntry()">+ Add Entry</button>
    </div>

    <div class="save-area">
      <button class="btn btn-save" onclick="saveWorld()">Save World Book</button>
      <span class="status" id="saveStatus"></span>
    </div>
  `;
}

function addWorldEntry() {
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.setAttribute('data-new', 'true');
  div.innerHTML = `
    <div class="entry-header">
      <span class="entry-id">new</span>
      <div class="entry-keys"><input type="text" placeholder="Keys" data-field="keys"></div>
      <input type="text" placeholder="备注" style="width:120px" data-field="comment">
    </div>
    <div class="entry-content"><textarea rows="4" data-field="content"></textarea></div>
    <div class="entry-actions"><button class="btn-sm btn-danger" onclick="this.closest('.entry-card').remove()">Remove</button></div>
  `;
  document.getElementById('worldEntries').appendChild(div);
}

function removeWorldEntry(id) {
  if (confirm('Delete entry #' + id + '?')) {
    api.del(`/api/worlds/${encodeURIComponent(currentTab.name)}/entries/${id}`).then(() => selectWorld(currentTab.name));
  }
}

async function saveWorld() {
  const status = document.getElementById('saveStatus');
  status.textContent = 'Saving...';
  status.className = 'status';

  // Collect entries from DOM
  const entries = {};
  document.querySelectorAll('#worldEntries .entry-card').forEach(card => {
    const id = card.getAttribute('data-id') || ('new_' + Date.now() + '_' + Math.random().toString(36).slice(2));
    entries[id] = {
      id: parseInt(id) || id,
      keys: (card.querySelector('[data-field="keys"]')?.value || '').split(',').map(k => k.trim()).filter(Boolean),
      secondary_keys: [],
      comment: card.querySelector('[data-field="comment"]')?.value || '',
      content: card.querySelector('[data-field="content"]')?.value || '',
      constant: false, selective: false,
      enabled: true
    };
  });

  const res = await api.put(`/api/worlds/${encodeURIComponent(currentTab.name)}`, { entries });
  if (res.ok) {
    status.textContent = 'Saved!';
    status.className = 'status ok';
    setTimeout(() => { selectWorld(currentTab.name); }, 500);
  } else {
    status.textContent = 'Error: ' + (res.error || 'unknown');
    status.className = 'status err';
  }
}

// === Launch ===
async function launch() {
  const btn = document.getElementById('btnLaunch');
  btn.disabled = true;
  btn.textContent = 'Launching...';
  const res = await api.post('/api/launch');
  if (res.ok) {
    btn.textContent = 'Launched! Open http://localhost:8000';
    setTimeout(() => { btn.textContent = 'Launch SillyTavern'; btn.disabled = false; }, 5000);
  } else {
    btn.textContent = 'Error launching';
    setTimeout(() => { btn.textContent = 'Launch SillyTavern'; btn.disabled = false; }, 3000);
  }
}

// === Init ===
refresh();
</script>
</body>
</html>
